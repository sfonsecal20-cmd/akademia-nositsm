<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKADEMIA NOSITSM</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #003366;
            color: white;
            padding: 18px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .chat-container {
            flex: 1;
            max-width: 1000px;
            width: 95%;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #e8f5e9;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 15px;
            gap: 10px;
            background: white;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-area button {
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-area button:hover {
            background: #004494;
        }

        .welcome {
            text-align: center;
            color: #64748b;
            margin-top: 30px;
        }

        .footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>AKADEMIA NOSITSM</h1>
        <p>Assistente Inteligente de Gestão de Processos e Mudança</p>
    </div>

    <div class="chat-container">

        <div class="messages" id="messages">
            <div class="welcome">
                <h3>Bem-vindo à AKADEMIA NOSITSM</h3>
                <br>
                <p>Podes fazer perguntas sobre GPM, formação, validação, stage, produção e processos da NOSi.</p>
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="input"
                placeholder="Escreva a sua pergunta..."
                onkeypress="if(event.key==='Enter') sendMessage()"
            >
            <button onclick="sendMessage()">Enviar</button>
        </div>

    </div>

    <div class="footer">
        AKADEMIA NOSITSM © 2026
    </div>

    <script>

        async function sendMessage() {

            let input = document.getElementById("input");
            let text = input.value.trim();

            if (!text) return;

            let messages = document.getElementById("messages");

            messages.innerHTML += `
                <div class="message user">
                    ${text}
                </div>
            `;

            input.value = "";

            try {

                let response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: text
                    })
                });

                let data = await response.json();

                messages.innerHTML += `
                    <div class="message bot">
                        ${data.response}
                    </div>
                `;

                messages.scrollTop = messages.scrollHeight;

            } catch (error) {

                messages.innerHTML += `
                    <div class="message bot">
                        Erro ao comunicar com o servidor.
                    </div>
                `;
            }
        }

    </script>

</body>
</html>
